document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;background:var(--c12);height:100%;overflow:auto;padding:var(--s8);display:flex;flex-direction:column;gap:var(--s7);box-shadow:-4px 0 24px rgba(0,0,0,.15)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-start\">\n          <div><div style=\"font-size:20px;font-weight:700\">{{selectedWithdrawal.seller}}<\u002Fdiv><div style=\"font-size:12px;color:var(--c5);margin-top:var(--s1)\">Yêu cầu ngày {{selectedWithdrawal.date}}<\u002Fdiv><\u002Fdiv>\n          <button sc-camel-on-click=\"{{closeWithdrawal}}\" style=\"background:none;border:none;font-size:18px;color:var(--c5)\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:30px;font-weight:900\">{{selectedWithdrawal.amount}}<\u002Fdiv>\n        <div style=\"border:1px solid rgba(170,170,170,.35);border-radius:var(--r-lg);padding:var(--s7);display:flex;flex-direction:column;gap:var(--s3);font-size:13px\">\n          <div style=\"display:flex;justify-content:space-between\"><span style=\"color:var(--c5)\">Ngân hàng<\u002Fspan><span style=\"font-weight:600\">Vietcombank<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between\"><span style=\"color:var(--c5)\">Số tài khoản<\u002Fspan><span style=\"font-weight:600;font-family:monospace\">0123456789<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between\"><span style=\"color:var(--c5)\">Chủ tài khoản<\u002Fspan><span style=\"font-weight:600\">{{selectedWithdrawal.seller}}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:var(--s3)\">\n          <label style=\"font-size:12px;font-weight:600;color:var(--c5)\">Lý do từ chối (nếu có)<\u002Flabel>\n          <textarea placeholder=\"Nhập lý do…\" style=\"min-height:70px;padding:var(--s5);border:1px solid rgba(170,170,170,.6);border-radius:var(--r-md);font-size:13px;resize:vertical\" style-focus=\"border-color:#00ADEE;box-shadow:0 0 0 3px rgba(0,173,238,.25)\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:var(--s3)\">\n          <button style=\"flex:1;height:42px;background:var(--c8);color:var(--c12);border:none;border-radius:var(--r-md);font-size:14px;font-weight:600\" style-hover=\"background:#73aa45\">Duyệt<\u002Fbutton>\n          <button style=\"flex:1;height:42px;background:var(--c12);color:var(--err);border:1px solid var(--err);border-radius:var(--r-md);font-size:14px;font-weight:600\" style-hover=\"background:rgba(217,52,43,.06)\">Từ chối<\u002Fbutton>\n        <\u002Fdiv>\n        <button style=\"height:42px;background:var(--c12);color:var(--c6);border:1px solid var(--c6);border-radius:var(--r-md);font-size:14px;font-weight:600\" style-hover=\"background:rgba(0,173,238,.06)\">Đánh dấu đã chi trả<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <!-- ================= DESIGN NOTES ================= -->\n  <sc-if value=\"{{isNotes}}\" hint-placeholder-val=\"{{false}}\">\n  <div style=\"max-width:960px;margin:0 auto;padding:var(--s10) var(--s8);display:flex;flex-direction:column;gap:var(--s10)\">\n    <div>\n      <div style=\"font-size:28px;font-weight:700\">Design notes<\u002Fdiv>\n      <div style=\"font-size:14px;color:var(--c5);margin-top:var(--s3)\">Ghi chú thiết kế, trạng thái component, và token đề xuất bổ sung.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid var(--err);background:rgba(217,52,43,.05);border-radius:var(--r-lg);padding:var(--s8);display:flex;flex-direction:column;gap:var(--s3)\">\n      <div style=\"font-size:14px;font-weight:700;color:var(--err)\">⚠ Token đề xuất bổ sung — chưa được duyệt<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--c2);line-height:1.6\">Bảng token gốc không có màu lỗi/từ chối. Đề xuất bổ sung <code style=\"background:rgba(0,0,0,.06);padding:2px 6px;border-radius:4px\">color-error: #D9342B<\u002Fcode> (contrast ≥4.5:1 trên nền trắng) cho: lỗi đăng nhập, badge \"Từ chối\" rút tiền, viền input lỗi. Cần Design System owner duyệt chính thức trước khi đưa vào token set.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:var(--s7)\">\n      <div style=\"font-size:18px;font-weight:700\">Trạng thái component<\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:var(--s5)\">\n        <div style=\"font-size:13px;font-weight:600;color:var(--c5)\">Button primary — default · hover · focus-visible · active · disabled · loading<\u002Fdiv>\n        <div style=\"display:flex;gap:var(--s5);flex-wrap:wrap;align-items:center\">\n          <button style=\"height:40px;padding:0 var(--s6);background:var(--c6);color:var(--c12);border:none;border-radius:var(--r-md);font-size:13px;font-weight:600\">Default<\u002Fbutton>\n          <button style=\"height:40px;padding:0 var(--s6);background:#0099d1;color:var(--c12);border:none;border-radius:var(--r-md);font-size:13px;font-weight:600\">Hover<\u002Fbutton>\n          <button style=\"height:40px;padding:0 var(--s6);background:var(--c6);color:var(--c12);border:none;border-radius:var(--r-md);font-size:13px;font-weight:600;box-shadow:0 0 0 3px rgba(0,173,238,.4)\">Focus<\u002Fbutton>\n          <button style=\"height:40px;padding:0 var(--s6);background:#0088ba;color:var(--c12);border:none;border-radius:var(--r-md);font-size:13px;font-weight:600\">Active<\u002Fbutton>\n          <button style=\"height:40px;padding:0 var(--s6);background:var(--c6);opacity:.45;color:var(--c12);border:none;border-radius:var(--r-md);font-size:13px;font-weight:600\" disabled=\"{{true}}\">Disabled<\u002Fbutton>\n          <button style=\"height:40px;padding:0 var(--s6);background:var(--c6);color:var(--c12);border:none;border-radius:var(--r-md);font-size:13px;font-weight:600;display:flex;align-items:center;gap:var(--s3)\"><span style=\"width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;display:inline-block;animation:medigo-spin .6s linear infinite\"><\u002Fspan>Loading<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:var(--s5)\">\n        <div style=\"font-size:13px;font-weight:600;color:var(--c5)\">Input — default · focus · error · disabled<\u002Fdiv>\n        <div style=\"display:flex;gap:var(--s5);flex-wrap:wrap\">\n          <input type=\"text\" placeholder=\"Default\" style=\"width:140px;height:40px;padding:0 var(--s5);border:1px solid rgba(170,170,170,.6);border-radius:var(--r-md);font-size:13px\">\n          <input type=\"text\" placeholder=\"Focus\" style=\"width:140px;height:40px;padding:0 var(--s5);border:1px solid var(--c6);border-radius:var(--r-md);font-size:13px;box-shadow:0 0 0 3px rgba(0,173,238,.25)\">\n          <input type=\"text\" placeholder=\"Error\" style=\"width:140px;height:40px;padding:0 var(--s5);border:1px solid var(--err);border-radius:var(--r-md);font-size:13px\">\n          <input type=\"text\" placeholder=\"Disabled\" disabled=\"{{true}}\" style=\"width:140px;height:40px;padding:0 var(--s5);border:1px solid rgba(170,170,170,.35);border-radius:var(--r-md);font-size:13px;color:var(--c5);background:rgba(170,170,170,.08)\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:var(--s5)\">\n        <div style=\"font-size:13px;font-weight:600;color:var(--c5)\">Badge — trạng thái đơn hàng &amp; rút tiền<\u002Fdiv>\n        <div style=\"display:flex;gap:var(--s3);flex-wrap:wrap\">\n          <span style=\"font-size:11px;font-weight:700;padding:var(--s1) var(--s5);border-radius:var(--r-xl);background:rgba(255,165,0,.15);color:#a36400\">Chờ duyệt<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:700;padding:var(--s1) var(--s5);border-radius:var(--r-xl);background:rgba(132,190,82,.18);color:#4c7a2c\">Đã duyệt<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:700;padding:var(--s1) var(--s5);border-radius:var(--r-xl);background:rgba(217,52,43,.12);color:var(--err)\">Từ chối *<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:700;padding:var(--s1) var(--s5);border-radius:var(--r-xl);background:rgba(0,173,238,.14);color:#00728f\">Đã chi trả<\u002Fspan>\n          <span style=\"font-size:11px;font-weight:700;padding:var(--s1) var(--s5);border-radius:var(--r-xl);background:rgba(170,170,170,.2);color:var(--c5)\">Đã khóa<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:var(--c5)\">* dùng token đề xuất color-error, xem cảnh báo phía trên<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:var(--s5)\">\n        <div style=\"font-size:13px;font-weight:600;color:var(--c5)\">Toggle — on · off · disabled<\u002Fdiv>\n        <div style=\"display:flex;gap:var(--s7);align-items:center\">\n          <span style=\"width:44px;height:24px;border-radius:var(--r-xl);background:var(--c8);position:relative;display:inline-block\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;right:3px;box-shadow:var(--sh)\"><\u002Fspan><\u002Fspan>\n          <span style=\"width:44px;height:24px;border-radius:var(--r-xl);background:rgba(170,170,170,.4);position:relative;display:inline-block\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;box-shadow:var(--sh)\"><\u002Fspan><\u002Fspan>\n          <span style=\"width:44px;height:24px;border-radius:var(--r-xl);background:rgba(170,170,170,.2);position:relative;display:inline-block;opacity:.6\"><span style=\"width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px\"><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:var(--s5)\">\n      <div style=\"font-size:18px;font-weight:700\">Responsive<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--c4);line-height:1.7\">Seller (A1–A3): mobile-first, kiểm tra ở 360px (nhỏ nhất) và 430px (lớn nhất trong nhóm mobile); các card overview chuyển 2×2 → 4×1 khi ≥600px. Admin (B1–B4): desktop-first, kiểm tra ở 1280px và 1920px; sidebar cố định 220px, bảng dùng scroll ngang dưới 1024px.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:var(--s5)\">\n      <div style=\"font-size:18px;font-weight:700\">Accessibility<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--c4);line-height:1.7\">Focus ring dùng box-shadow 3px rgba(color-6, .25–.4), đạt tương phản ≥3:1 trên nền trắng và nền tối color-3. Toàn bộ trạng thái tương tác (hover/focus-visible/active/disabled) được định nghĩa trên mọi nút, input, toggle. Trạng thái quan trọng (số dư, trạng thái rút tiền) luôn hiển thị trực tiếp trên bảng/card, không ẩn sau click.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:var(--s5)\">\n      <div style=\"font-size:18px;font-weight:700\">Edge case đã xử lý<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--c4);line-height:1.7\">Empty state tuyến dưới (A3); truncation cho tên dài &amp; link giới thiệu (ellipsis); số tiền lớn định dạng theo dấu chấm; SĐT/CCCD/số tài khoản đầy đủ chỉ hiện trong panel chi tiết dành riêng admin, danh sách công khai chỉ hiện rút gọn.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'A3',\n    pwdVisible: false,\n    showLoginError: false,\n    regStep: 1,\n    tncChecked: false,\n    copyLabel: 'Copy link',\n    rangeFilter: 'week',\n    memberSearch: '',\n    selectedMemberId: null,\n    selectedWithdrawalId: null,\n    productEnabled: true,\n    lockedIds: {},\n    paymentMethod: 'vnpay',\n    showQRPayment: false,\n    showPaymentSuccess: false,\n    orderId: 'DH923983',\n    buyerName: 'Nguyễn Văn A', buyerPhone: '0901234567', buyerEmail: 'nguyenvana@gmail.com', buyerBankAccount: '0123456789',\n    buyerCccd: '079203001234', buyerAddress: '12 Nguyễn Huệ', buyerDob: '15/03/1992'\n  };\n\n  PAYMENT_METHODS = [\n    { id: 'vnpay', label: 'Thanh toán bằng VNPAY', logoLabel: 'VN', logoBg: '#005baa' },\n    { id: 'viettelmoney', label: 'Thanh toán bằng Viettel Money', logoLabel: 'VTM', logoBg: '#ee0033' }\n  ];\n\n  NAV = [\n    ['A1','A1 · Thông tin nhận hàng'],['A2','A2 · Đăng ký seller'],['A3','A3 · Dashboard'],\n    ['B1','B1 · Đăng nhập admin'],['B2','B2 · Thành viên'],['B3','B3 · Rút tiền'],\n    ['NOTES','Design notes']\n  ];\n\n  ADMIN_NAV = [['B2','Thành viên'],['B3','Yêu cầu rút tiền']];\n\n  DOWNLINE = [\n    { id:1, name:'Trần Thị Bích', phone:'090•••123', joined:'12/08/2026', initial:'B', status:'completed' },\n    { id:2, name:'Lê Văn Cường',  phone:'091•••456', joined:'20/08/2026', initial:'C', status:'pending' },\n    { id:3, name:'Phạm Thị Dung', phone:'098•••789', joined:'22/08/2026', initial:'D', status:'cancelled' }\n  ];\n\n  MEMBERS = [\n    { id:1, name:'Trần Thị Bích', contact:'090•••123', affId:'923983', upline:'—', rank:'Bạc', joined:'12/08/2026', status:'active',\n      tree:[{name:'Lê Văn Cường', orders:4},{name:'Phạm Thị Dung', orders:1}] },\n    { id:2, name:'Lê Văn Cường', contact:'091•••456', affId:'118820', upline:'Trần Thị Bích', rank:'Đồng', joined:'20/08/2026', status:'active',\n      tree:[{name:'Ngô Thị Em', orders:2}] },\n    { id:3, name:'Phạm Thị Dung', contact:'098•••789', affId:'302914', upline:'Trần Thị Bích', rank:'Đồng', joined:'22/08/2026', status:'locked', tree:[] },\n    { id:4, name:'Ngô Thị Em', contact:'097•••112', affId:'440221', upline:'Lê Văn Cường', rank:'Đồng', joined:'25/08/2026', status:'active', tree:[] },\n    { id:5, name:'Vũ Minh Khang', contact:'093•••998', affId:'552017', upline:'—', rank:'Vàng', joined:'01/08/2026', status:'active', tree:[{name:'Đỗ Anh Tuấn', orders:9}] }\n  ];\n\n  WITHDRAWALS = [\n    { id:1, seller:'Trần Thị Bích', amount:'4.850.000đ', date:'24/08/2026', status:'pending', accountNumber:'0123456789', bankName:'Vietcombank', branch:'Chi nhánh Q1' },\n    { id:2, seller:'Vũ Minh Khang', amount:'12.200.000đ', date:'22/08/2026', status:'approved', accountNumber:'0398211045', bankName:'Techcombank', branch:'Chi nhánh Tân Bình' },\n    { id:3, seller:'Lê Văn Cường', amount:'980.000đ', date:'20/08/2026', status:'rejected', accountNumber:'0788452201', bankName:'ACB', branch:'Chi nhánh Q3' },\n    { id:4, seller:'Ngô Thị Em', amount:'2.100.000đ', date:'18/08/2026', status:'paid', accountNumber:'0611239987', bankName:'BIDV', branch:'Chi nhánh Bình Thạnh' },\n    { id:5, seller:'Phạm Thị Dung', amount:'640.000đ', date:'15/08/2026', status:'pending', accountNumber:'0245781163', bankName:'Vietinbank', branch:'Chi nhánh Q7' }\n  ];\n\n  CHART = [\n    { label:'T2', v:.4 },{ label:'T3', v:.65 },{ label:'T4', v:.5 },{ label:'T5', v:.9 },\n    { label:'T6', v:.7 },{ label:'T7', v:.55 },{ label:'CN', v:.35 }\n  ];\n\n  RANGES = [['today','Hôm nay'],['week','Tuần'],['month','Tháng'],['custom','Tùy chọn']];\n\n  tabStyle(active, dark) {\n    const base = 'font-size:12px;font-weight:600;padding:6px 12px;border-radius:30px;border:1px solid transparent;';\n    if (active) return base + (dark ? 'background:#344557;color:#FFFFFF' : 'background:#00ADEE;color:#FFFFFF');\n    return base + 'background:transparent;color:#939393';\n  }\n\n  badge(status) {\n    const map = {\n      completed: ['rgba(132,190,82,.18)', '#4c7a2c', 'Hoàn tất'],\n      pending: ['rgba(255,165,0,.15)', '#a36400', 'Chờ xử lý'],\n      cancelled: ['rgba(217,52,43,.12)', '#D9342B', 'Đã hủy'],\n      active: ['rgba(132,190,82,.18)', '#4c7a2c', 'Đang hoạt động'],\n      locked: ['rgba(170,170,170,.2)', '#939393', 'Đã khóa'],\n      approved: ['rgba(132,190,82,.18)', '#4c7a2c', 'Đã duyệt'],\n      rejected: ['rgba(217,52,43,.12)', '#D9342B', 'Từ chối'],\n      paid: ['rgba(0,173,238,.14)', '#00728f', 'Đã chi trả']\n    };\n    return map[status] || map.pending;\n  }\n\n  buildQrModules() {\n    const N = 17;\n    const isFinder = (r, c) => {\n      const corners = [[0,0],[0,N-7],[N-7,0]];\n      return corners.some(([cr, cc]) => r >= cr && r < cr + 7 && c >= cc && c < cc + 7 &&\n        (r === cr || r === cr + 6 || c === cc || c === cc + 6 || (r >= cr + 2 && r <= cr + 4 && c >= cc + 2 && c <= cc + 4)));\n    };\n    let seed = 42;\n    const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };\n    const cells = [];\n    for (let r = 0; r < N; r++) {\n      for (let c = 0; c < N; c++) {\n        const dark = isFinder(r, c) || rand() > 0.52;\n        cells.push({ color: dark ? '#344557' : '#FFFFFF' });\n      }\n    }\n    return cells;\n  }\n\n  renderVals() {\n    const s = this.state;\n    const set = (screen) => () => this.setState({ screen, selectedMemberId: null, selectedWithdrawalId: null, regStep: 1 });\n\n    const nav = this.NAV.map(([id, label]) => ({\n      id, label, onClick: set(id),\n      style: this.tabStyle(s.screen === id, false)\n    }));\n\n    const adminOn = ['B2','B3'].includes(s.screen);\n    const adminNav = this.ADMIN_NAV.map(([id, label]) => ({\n      id, label, onClick: set(id),\n      style: 'text-align:left;font-size:13px;font-weight:600;padding:10px 12px;border-radius:5px;border:none;background:' +\n        (s.screen === id ? 'rgba(255,255,255,.14)' : 'transparent') + ';color:#FFFFFF;opacity:' + (s.screen === id ? '1' : '.75')\n    }));\n\n    const downline = this.DOWNLINE.map(d => {\n      const [bg, color, label] = this.badge(d.status);\n      return { ...d, badgeBg: bg, badgeColor: color, statusLabel: label };\n    });\n\n    const members = this.MEMBERS\n      .filter(m => !s.memberSearch || m.name.toLowerCase().includes(s.memberSearch.toLowerCase()) || m.affId.includes(s.memberSearch))\n      .map(m => {\n        const [bg, color, label] = this.badge(m.status);\n        return { ...m, badgeBg: bg, badgeColor: color, statusLabel: label, onClick: () => this.setState({ selectedMemberId: m.id }) };\n      });\n\n    const withdrawals = this.WITHDRAWALS.map(w => {\n      const [bg, color, label] = this.badge(w.status);\n      return { ...w, badgeBg: bg, badgeColor: color, statusLabel: label, onClick: () => this.setState({ selectedWithdrawalId: w.id }) };\n    });\n\n    const ranges = this.RANGES.map(([id, label]) => ({\n      id, label, onClick: () => this.setState({ rangeFilter: id }),\n      style: 'font-size:12px;font-weight:600;padding:8px 15px;border-radius:30px;border:1px solid ' +\n        (s.rangeFilter === id ? '#00ADEE' : 'rgba(170,170,170,.4)') + ';background:' +\n        (s.rangeFilter === id ? 'rgba(0,173,238,.1)' : '#FFFFFF') + ';color:' + (s.rangeFilter === id ? '#00ADEE' : '#424242') + ';flex:none'\n    }));\n\n    const chartBars = this.CHART.map(c => ({ label: c.label, h: Math.round(c.v * 100) + '%' }));\n\n    const paymentMethods = this.PAYMENT_METHODS.map(pm => {\n      const checked = s.paymentMethod === pm.id;\n      return {\n        ...pm, checked,\n        borderColor: checked ? '#00ADEE' : 'rgba(170,170,170,.35)',\n        bg: checked ? 'rgba(0,173,238,.05)' : '#FFFFFF',\n        onSelect: () => this.setState({ paymentMethod: pm.id })\n      };\n    });\n\n    const selectedMember = s.selectedMemberId ? this.MEMBERS.find(m => m.id === s.selectedMemberId) : null;\n    const selectedWithdrawal = s.selectedWithdrawalId ? this.WITHDRAWALS.find(w => w.id === s.selectedWithdrawalId) : null;\n    const isLocked = selectedMember ? (s.lockedIds[selectedMember.id] ?? (selectedMember.status === 'locked')) : false;\n\n    const regStepBg = (n) => s.regStep >= n ? '#00ADEE' : 'rgba(170,170,170,.35)';\n\n    return {\n      nav, adminNav,\n      isA1: s.screen === 'A1', isA2: s.screen === 'A2', isA3: s.screen === 'A3',\n      isB1: s.screen === 'B1', isB2: s.screen === 'B2', isB3: s.screen === 'B3',\n      isNotes: s.screen === 'NOTES', isAdminShell: adminOn,\n\n      pwdInputType: s.pwdVisible ? 'text' : 'password',\n      pwdInputStyle: 'flex:1;height:44px;padding:0 60px 0 12px;border:1px solid ' + (s.showLoginError ? '#D9342B' : 'rgba(170,170,170,.6)') + ';border-radius:5px;font-size:16px;width:100%',\n      pwdToggleLabel: s.pwdVisible ? 'Ẩn' : 'Hiện',\n      togglePwd: () => this.setState({ pwdVisible: !s.pwdVisible }),\n      showLoginError: s.showLoginError,\n      toggleLoginError: () => this.setState({ showLoginError: !s.showLoginError }),\n      goToA2: set('A2'), goToA3: set('A3'),\n      showQRPayment: s.showQRPayment, orderId: s.orderId,\n      qrModules: this.buildQrModules(),\n      openQRPayment: () => this.setState({ showQRPayment: true }),\n      closeQRPayment: () => this.setState({ showQRPayment: false }),\n      confirmQRPayment: () => this.setState({ showQRPayment: false, showPaymentSuccess: true }),\n      showPaymentSuccess: s.showPaymentSuccess,\n      choosRegisterSeller: () => this.setState({ showPaymentSuccess: false, screen: 'A2', regStep: 1 }),\n      choosSkipSeller: () => this.setState({ showPaymentSuccess: false }),\n      buyerName: s.buyerName, setBuyerName: (e) => this.setState({ buyerName: e.target.value }),\n      buyerPhone: s.buyerPhone, setBuyerPhone: (e) => this.setState({ buyerPhone: e.target.value }),\n      buyerEmail: s.buyerEmail, setBuyerEmail: (e) => this.setState({ buyerEmail: e.target.value }),\n      buyerBankAccount: s.buyerBankAccount, setBuyerBankAccount: (e) => this.setState({ buyerBankAccount: e.target.value }),\n      buyerCccd: s.buyerCccd, setBuyerCccd: (e) => this.setState({ buyerCccd: e.target.value }),\n      buyerAddress: s.buyerAddress, setBuyerAddress: (e) => this.setState({ buyerAddress: e.target.value }),\n      buyerDob: s.buyerDob, setBuyerDob: (e) => this.setState({ buyerDob: e.target.value }),\n\n      regSteps: [1,2,3,4].map(n => ({ bg: regStepBg(n) })),\n      isRegStep1: s.regStep === 1, isRegStep2: s.regStep === 2, isRegStep3: s.regStep === 3, isRegStep4: s.regStep === 4,\n      regNext: () => this.setState({ regStep: Math.min(4, s.regStep + 1) }),\n      regPrev: () => this.setState({ regStep: Math.max(1, s.regStep - 1) }),\n      otpBoxes: [0,1,2,3,4,5],\n      tncChecked: s.tncChecked,\n      toggleTnc: () => this.setState({ tncChecked: !s.tncChecked }),\n      tncDisabled: !s.tncChecked,\n      regSubmitStyle: 'flex:2;height:46px;border:none;border-radius:5px;font-size:15px;font-weight:600;box-shadow:1px 1px 5px 0 rgba(204,204,204,.9);' +\n        (s.tncChecked ? 'background:#00ADEE;color:#FFFFFF' : 'background:rgba(0,173,238,.35);color:#FFFFFF;cursor:not-allowed'),\n      copyLink: () => { this.setState({ copyLabel: 'Đã copy!' }); setTimeout(() => this.setState({ copyLabel: 'Copy link' }), 1500); },\n      copyLabel: s.copyLabel,\n\n      ranges, chartBars, downline, paymentMethods,\n      hasF1: downline.length > 0, noF1: downline.length === 0, f1Count: downline.length,\n\n      members, withdrawals,\n      memberSearch: s.memberSearch, setMemberSearch: (e) => this.setState({ memberSearch: e.target.value }),\n\n      hasSelectedMember: !!selectedMember,\n      selectedMember,\n      closeMember: () => this.setState({ selectedMemberId: null }),\n      lockButtonLabel: isLocked ? 'Mở khóa tài khoản' : 'Khóa tài khoản',\n      lockButtonStyle: 'height:38px;padding:0 16px;border-radius:5px;font-size:13px;font-weight:600;border:1px solid ' +\n        (isLocked ? '#00ADEE' : '#D9342B') + ';background:#FFFFFF;color:' + (isLocked ? '#00ADEE' : '#D9342B'),\n      toggleLockSelected: () => selectedMember && this.setState({ lockedIds: { ...s.lockedIds, [selectedMember.id]: !isLocked } }),\n\n      hasSelectedWithdrawal: !!selectedWithdrawal,\n      selectedWithdrawal,\n      closeWithdrawal: () => this.setState({ selectedWithdrawalId: null }),\n\n      productToggleStyle: 'width:44px;height:24px;border-radius:30px;border:none;padding:0;position:relative;background:' + (s.productEnabled ? '#84BE52' : 'rgba(170,170,170,.4)'),\n      productKnobStyle: 'width:18px;height:18px;border-radius:50%;background:#FFFFFF;position:absolute;top:3px;' + (s.productEnabled ? 'right:3px' : 'left:3px') + ';box-shadow:1px 1px 5px 0 rgba(204,204,204,.9);display:block',\n      toggleProduct: () => this.setState({ productEnabled: !s.productEnabled })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
